<!DOCTYPE html>
<!--
  Static preview of the Violet theme (Status > Overview) with fake router data.
  Mirrors the markup produced by header.ut / footer.ut. Serve this folder's
  parent over HTTP (see README) and open /preview/index.html.
-->
<html lang="en" data-darkmode="true">
<head>
	<meta charset="utf-8">
	<title>OpenWrt | Overview</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="../luci-theme-violet/htdocs/luci-static/violet/cascade.css">
	<link rel="icon" href="../luci-theme-violet/htdocs/luci-static/violet/logo.svg" sizes="any">
	<script>
		var m = location.search.match(/mode=(light|dark)/);
		if (m) document.documentElement.setAttribute('data-darkmode', m[1] == 'dark');
	</script>
</head>
<body class="lang_en Overview" data-page="admin-status-overview">
	<aside id="vl-sidebar">
		<a class="brand" href="#" title="Violet · ASUS RT-AX59U">
			<span class="brand-name">Violet</span>
		</a>
		<div class="vl-search">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
			<input type="search" id="vl-search" placeholder="Search sections" autocomplete="off" spellcheck="false">
			<kbd id="vl-search-kbd">Ctrl K</kbd>
		</div>
		<nav id="vl-nav"><ul class="nav" id="topmenu" style="display:none"></ul></nav>
		<div class="vl-user">
			<span class="vl-avatar">R</span>
			<span class="vl-user-meta">
				<span class="vl-user-name" style="display:block">root</span>
				<span class="vl-user-sub" style="display:block" title="ASUS RT-AX59U">192.168.1.1</span>
			</span>
			<a class="vl-logout" href="#" title="Log out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></a>
		</div>
	</aside>
	<div id="vl-scrim"></div>

	<div id="vl-main">
		<header>
			<button type="button" id="vl-toggle" title="Toggle sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
			<div id="vl-crumbs"><span class="crumb">Overview</span></div>
			<div id="indicators" class="pull-right"><span data-indicator="poll-status" data-clickable="true" data-style="active" onclick="var p=this.getAttribute('data-style')=='active';this.setAttribute('data-style',p?'inactive':'active');this.firstChild.data=p?'Paused':'Refreshing'">Refreshing</span></div>
		</header>

		<div id="maincontent" class="container">
			<div id="tabmenu" style="display:none"></div>
			<div id="view">
				<h2 name="content">Status</h2>
				<div id="includes"></div>
			</div>
		</div>

		<footer>
			<a class="sb-item sb-remote" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15-4-4 4-4M17 9l4 4-4 4"/></svg>Violet</a>
			<a class="sb-item sb-hide-sm" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 4-6 3-12 7"/></svg>OpenWrt 25.12.5</a>
			<span class="sb-spacer"></span>
			<ul class="breadcrumb" id="modemenu" style="display:none"></ul>
			<span class="sb-item sb-credit"><span>Designed by Emran Mostafa</span><span class="sb-sep" aria-hidden="true">|</span><a href="#">Powered by LuCI</a></span>
		</footer>
	</div>

	<script src="modules.js"></script>
	<script src="luci-mock.js"></script>
	<script>
		/* Same structure and Hide/Show behaviour as LuCI's view/status/index.js */
		function toggleSection(container, ev) {
			const btn = ev.currentTarget;
			const hide = btn.getAttribute('data-style') != 'active';

			btn.setAttribute('data-style', hide ? 'active' : 'inactive');
			btn.setAttribute('class', hide ? 'label notice' : 'label');
			btn.firstChild.data = hide ? 'Show' : 'Hide';
			btn.blur();

			container.style.display = hide ? 'none' : '';
		}

		function section(title, content) {
			return E('div', { 'class': 'cbi-section fade-in' }, [
				E('div', { 'class': 'cbi-title' }, [
					E('h3', { 'style': 'display: flex; justify-content: space-between' }, [
						title,
						E('span', {
							'class': 'label',
							'style': 'display: flex; align-items: center; justify-content: center; min-width: 4em',
							'data-style': 'inactive',
							'data-indicator': 'poll-status',
							'data-clickable': 'true',
							'click': (ev) => toggleSection(content, ev)
						}, 'Hide')
					])
				]),
				content
			]);
		}

		function tableRows(rows) {
			return E('table', { 'class': 'table' }, rows.map(r => E('tr', { 'class': 'tr' }, [
				E('td', { 'class': 'td left', 'width': '33%' }, r[0]),
				E('td', { 'class': 'td left' }, r[1])
			])));
		}

		function bar(used, total) {
			const pc = Math.floor(used / total * 100);
			return E('div', { 'class': 'cbi-progressbar', 'title': '%1024.2mB / %1024.2mB (%d%%)'.format(used, total, pc) }, E('div', { 'style': 'width:' + pc + '%' }));
		}

		const includes = [ 'view.status.include.00_violet_speed', 'view.status.include.01_violet_clients' ];
		const host = document.getElementById('includes');

		Promise.all(includes.map(n => L.require(n))).then(mods => {
			const containers = mods.map(mod => {
				const c = E('div');
				host.appendChild(section(mod.title, c));
				return c;
			});

			host.appendChild(section('System', tableRows([
				[ 'Hostname', 'Violet' ], [ 'Model', 'ASUS RT-AX59U' ], [ 'Architecture', 'ARMv8 Processor rev 4' ],
				[ 'Target Platform', 'mediatek/filogic' ], [ 'Firmware Version', 'OpenWrt 25.12.5 r33051-f5dae5ece4' ],
				[ 'Kernel Version', '6.12.94' ], [ 'Uptime', '1h 39m 32s' ], [ 'Load Average', '0.08, 0.05, 0.06' ]
			])));

			host.appendChild(section('Memory', tableRows([
				[ 'Total Available', bar(335860736, 507637760) ],
				[ 'Used', bar(165761024, 507637760) ],
				[ 'Buffered', bar(3145728, 507637760) ]
			])));

			const refresh = () => Promise.all(mods.map(m => m.load())).then(results => {
				results.forEach((r, i) => {
					const content = mods[i].render(r);
					containers[i].textContent = '';
					containers[i].appendChild(content);
				});
			});

			refresh();
			setInterval(refresh, 5000);
		}).catch(err => {
			host.appendChild(E('pre', {}, 'Preview error: ' + err + '\n' + (err.stack || '')));
			console.error(err);
		});

		L.require('menu-violet').catch(err => console.error(err));
	</script>
</body>
</html>
